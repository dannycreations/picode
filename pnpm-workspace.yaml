nodeLinker: hoisted

packages:
  - packages/*

patchedDependencies:
  '@earendil-works/pi-coding-agent': patches/@earendil-works__pi-coding-agent.patch

allowBuilds:
  '@google/genai': true
  '@parcel/watcher': true
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: true
  protobufjs: true

minimumReleaseAgeExclude:
  - '@types/vscode@1.138.0'
  - prettier@3.9.7
  - typebox@1.3.33
