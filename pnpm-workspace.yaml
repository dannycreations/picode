nodeLinker: hoisted

packages:
  - packages/*

patchedDependencies:
  '@earendil-works/pi-coding-agent': patches/@earendil-works__pi-coding-agent.patch

allowBuilds:
  '@google/genai': true
  '@parcel/watcher': true
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: true
  protobufjs: true

minimumReleaseAgeExclude:
  - '@tanstack/react-virtual@3.14.11'
  - '@tanstack/virtual-core@3.17.9'
  - lucide-react@1.42.0
