nodeLinker: hoisted

packages:
  - packages/*

allowBuilds:
  '@google/genai': true
  '@parcel/watcher': true
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: true
  protobufjs: true

patchedDependencies:
  '@earendil-works/pi-coding-agent': patches/@earendil-works__pi-coding-agent.patch

minimumReleaseAgeExclude:
  - '@types/vscode@1.134.0'
  - '@vitejs/plugin-react@6.1.0'
  - vite@8.2.2
